services:
  postgres-demo:
    image: postgres:17-alpine
    container_name: prospect-finder-bvq-demo-db
    environment:
      POSTGRES_DB: prospect_finder_demo
      POSTGRES_USER: prospect_demo
      POSTGRES_PASSWORD: prospect_demo
    ports:
      - "5434:5432"
    volumes:
      - prospect_finder_demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospect_demo -d prospect_finder_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  prospect_finder_demo_data:
