services:
  postgres:
    image: postgres:17-alpine
    container_name: prospect-finder-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prospect_finder_bvq}
      POSTGRES_USER: ${POSTGRES_USER:-prospect_finder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prospect_finder}

    ports:
      - "5432:5432"

    volumes:
      - prospect_finder_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-prospect_finder} -d ${POSTGRES_DB:-prospect_finder_bvq}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped


volumes:
  prospect_finder_postgres_data:
    name: prospect_finder_postgres_data